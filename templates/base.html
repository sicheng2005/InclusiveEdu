<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}无障碍线上教学辅助平台{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <!-- 引入 MediaPipe Hands 需要的库 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-universal-access-circle"></i> 无障碍教学平台
            </a>
            <div class="d-flex align-items-center">
                {% if user %}
                    <a href="/" class="btn btn-link text-white text-decoration-none me-2" title="返回首页"><i class="bi bi-house-door"></i> 首页</a>
                    <span class="text-white me-3">
                        <i class="bi bi-person-circle"></i> {{ user.username }}
                        <span class="badge bg-light text-primary ms-1">{{ role_label }}</span>
                    </span>
                    <a href="/logout" class="btn btn-outline-light btn-sm">退出登录</a>
                {% else %}
                    <a href="/login" class="btn btn-outline-light btn-sm me-2">登录</a>
                    <a href="/register" class="btn btn-light btn-sm">注册</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-light text-center py-3 mt-auto border-top">
        <small class="text-muted">无障碍线上教学辅助平台 &copy; 2026 冯如杯参赛作品</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/sign_language.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
